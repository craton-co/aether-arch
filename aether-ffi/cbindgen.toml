language = "C"
header = """/* AetherArch C API — auto-generated by cbindgen. Do not edit. */
/* SPDX-License-Identifier: Apache-2.0 OR Commercial */"""
include_guard = "AETHER_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify. */"
style = "both"
cpp_compat = true

[export]
# No prefix — our types/constants already use Aether/AETHER_ naming

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
rename_args = "None"
# Fix #16: emit __attribute__((warn_unused_result)) on functions
# marked with #[must_use] in Rust, so C compilers warn when callers
# ignore error codes.
must_use = "__attribute__((warn_unused_result))"
