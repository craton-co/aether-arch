[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aether"
version = "0.1.0"
description = "Python bindings for AetherArch — next-gen neural-probabilistic file archiver"
readme = "../README.md"
license = {text = "Apache-2.0 OR Commercial"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Archiving :: Compression",
]
keywords = ["compression", "archiver", "bwt", "entropy-coding"]

[tool.maturin]
features = ["pyo3/extension-module"]
