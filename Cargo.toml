[workspace]
resolver = "2"
members = ["aether-core", "aether-cli", "aether-ffi", "aether-server", "aether-wasm"]
exclude = ["aether-python"]

[workspace.metadata.features]
enterprise = ["aether-core/enterprise", "aether-cli/enterprise"]

[workspace.package]
edition = "2021"
# MSRV is floored at 1.88 by a transitive dependency (tonic 0.14.6 requires
# rustc 1.88). Verified with `cargo +1.88.0 check --workspace`.
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/craton-co/aether-arch"

[workspace.dependencies]
aether-core = { path = "aether-core" }
thiserror = "2"
anyhow = "1"
blake3 = "1"
fastcdc = "3"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
byteorder = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"
humansize = "2"
crc32fast = "1"
## Pinned: lz4_flex frame format changes between minor versions could cause
## silent decode failures.  Any upgrade must be validated with roundtrip tests
## against archives created with the pinned version.
lz4_flex = "0.11.2"
libsais-sys = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Dedicated profiling profile: release perf + full symbol info for flamegraphs.
# Don't perturb normal `cargo build --release` output. Use with `--profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Profile-guided optimization (PGO) profile.
# Inherits release flags but lives in its own target subdir
# (target/<triple>/release-pgo/) so PGO instrumentation/use artifacts don't
# poison normal `cargo build --release` outputs. Drive via scripts/pgo.ps1,
# which wraps `cargo pgo instrument` + a training workload + `cargo pgo optimize`.
# Do NOT use this profile directly; `cargo build --profile release-pgo` without
# the wrapper produces a non-PGO build that just lives in the wrong directory.
[profile.release-pgo]
inherits = "release"
lto = "thin"
codegen-units = 1
