[workspace]
resolver = "2"
members = ["aether-core", "aether-cli", "aether-ffi", "aether-server", "aether-wasm"]
exclude = ["aether-python"]

[workspace.metadata.features]
enterprise = ["aether-core/enterprise", "aether-cli/enterprise"]

[workspace.package]
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/craton-co/aether-arch"

[workspace.dependencies]
aether-core = { path = "aether-core" }
thiserror = "2"
anyhow = "1"
blake3 = "1"
fastcdc = "3"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
byteorder = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"
humansize = "2"
crc32fast = "1"
## Pinned: lz4_flex frame format changes between minor versions could cause
## silent decode failures.  Any upgrade must be validated with roundtrip tests
## against archives created with the pinned version.
lz4_flex = "0.11.2"
divsufsort = "2"

[profile.release]
lto = "thin"
codegen-units = 1
