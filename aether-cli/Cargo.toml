[package]
name = "aether-cli"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AetherArch CLI — next-generation file archiver"

[[bin]]
name = "aet"
path = "src/main.rs"

[features]
## Parallel compression and decompression. On by default: `aet` is an
## application, and released binaries should use the machine they run on.
## Output is byte-identical to a single-threaded build at every thread count.
default = ["threading"]
threading = ["aether-core/threading"]
enterprise = ["aether-core/enterprise", "threading"]

[dependencies]
aether-core = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
humansize = { workspace = true }
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
