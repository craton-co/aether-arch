[package]
name = "aether-core"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AetherArch compression library — neural-probabilistic archiving"
readme = "../README.md"
keywords = ["compression", "archiver", "bwt", "entropy-coding", "neural"]
categories = ["compression", "encoding"]

[dependencies]
thiserror = { workspace = true }
blake3 = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
fastcdc = { workspace = true }
zstd = { workspace = true }
rayon = { workspace = true, optional = true }
tracing = { workspace = true }
crc32fast = { workspace = true }
lz4_flex = { workspace = true, optional = true }
divsufsort = { workspace = true }
tempfile = "3"
filetime = "0.2"
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
zeroize = { version = "1", optional = true }
subtle = { version = "2", optional = true }
getrandom_crate = { package = "getrandom", version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "compression"
harness = false

[features]
default = ["context-mixer", "lz4"]
## PAQ-inspired context-mixing predictor (~100 MiB per instance).
## Disable to reduce binary size and memory usage if only NeuralSSM is needed.
context-mixer = []
## LZ4 preprocessing path (lz4_flex crate).
## Disable to eliminate the lz4_flex dependency entirely.
lz4 = ["dep:lz4_flex"]
cloud = []
threading = ["dep:rayon"]
## Enterprise features (commercial license required for proprietary use).
## Enables encryption (AES-256-GCM, ChaCha20-Poly1305), multi-threaded decompression, and cloud storage.
enterprise = ["dep:aes-gcm", "dep:chacha20poly1305", "dep:argon2", "dep:zeroize", "dep:subtle", "dep:getrandom_crate", "cloud", "threading"]
## Placeholder for future Candle-based neural model inference
neural-candle = []
## Placeholder for future ONNX Runtime neural model inference
neural-ort = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
